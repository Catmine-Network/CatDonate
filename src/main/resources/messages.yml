reload-rejected: "<red>Không thể đổi partner/domain khi còn giao dịch chưa kết thúc."
reload-failed: "<red>Không thể tải cấu hình: {reason}"
admin-view: "<gold>{request_id}</gold> player={player}, status={status}, reward={reward_state}, polls={polls}, error={error}"
