submitted: "<green>Đã nhận thẻ. Mã giao dịch: <white>{request_id}</white>.</green> <gray>Dùng /napthe trangthai {request_id} để kiểm tra."
submitted-wait: "<green>Đã nhận thẻ. Mã giao dịch: <white>{request_id}</white>.</green> <yellow>Vui lòng chờ khoảng {seconds} giây để hệ thống kiểm tra kết quả.</yellow>"
